
[project]
name = "ideas"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.2",
    "greenlet>=3.5.3",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "pyjwt>=2.13.0",
    "redis>=8.0.1",
    "bcrypt>=5.0.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "ruff>=0.15.20",
    "mypy>=2.2.0",
    "asgiref>=3.12.1",
    "gigachat>=0.2.1",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
]

[tool.ruff]
line-length = 120
exclude = [".venv", "venv", ".env", "env", "alembic", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = [".venv", "venv", ".env", "env", "alembic", "migrations"]
